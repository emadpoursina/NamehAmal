services:
  app:
    build: .
    # Same host port as local start / nml.localhost reverse proxy
    ports:
      - "3060:3060"
    environment:
      # Use the host dev.db bind-mounted below (same file as local file:./dev.db)
      DATABASE_URL: file:/workspace/dev.db
      PORT: "3060"
      HOSTNAME: 0.0.0.0
    volumes:
      # Bind-mount project root so dev.db (and any SQLite WAL/SHM sidecars) stay on the host
      - .:/workspace
    restart: unless-stopped
